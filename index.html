<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/public/favicon.svg" />
    <link rel="stylesheet" href="/src/main.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200..900&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ticket Generator</title>
  </head>
  <body>
    <header class="header">
      <img
        class="header__logo"
        src="/src/assets/images/logo-full.svg"
        alt="Logo"
      />
      <div class="hero">
        <h1 class="hero__title">
          Your Journey to Coding Conf 2026 Starts Here!
        </h1>
        <p class="hero__text">
          Secure your spot at next year's biggest coding conference.
        </p>
      </div>
    </header>

    <main class="main">
      <form
        action=""
        class="main__ticket-form"
        id="ticket-form"
        name="ticket-form"
        method="get"
      >
        <label class="ticket-form__label" for="avatar">Upload avatar</label>
        <div class="avatar-upload" id="avatar-wrapper">
          <label class="avatar-upload__label" for="avatar"
            ><img src="/src/assets/images/icon-upload.svg" alt="Upload icon" class="avatar-upload__icon">
            <input
              class="avatar-upload__input"
              type="file"
              name="avatar"
              id="avatar"
              accept="image/*"
          /></label>
          <p class="avatar-upload__text">Drag and drop or click to upload</p>
        </div>
        <p class="ticket-form__hint">
          Upload your photo (JPG or PNG, max size: 500KB).
        </p>

        <label class="ticket-form__label" for="fullname">Full Name</label>
        <input
          class="ticket-form__input"
          type="text"
          name="fullname"
          id="fullname"
        />

        <label class="ticket-form__label" for="email">Email Address</label>
        <input
          class="ticket-form__input"
          type="email"
          name="email"
          id="email"
          placeholder="example@email.com"
        />

        <label class="ticket-from__label" for="github">GitHub Username</label>
        <input
          class="ticket-form__input"
          type="text"
          name="github"
          id="github"
          placeholder="@yourusername"
        />

        <input
          class="ticket-form__submit"
          type="submit"
          value="Generate My Ticket"
        />
      </form>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
