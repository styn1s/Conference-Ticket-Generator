<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/public/favicon.svg" />
    <link rel="stylesheet" href="/src/main.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200..900&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ticket Generator</title>
  </head>
  <body>
    <header class="header">
      <img
        class="header__logo"
        src="/src/assets/images/logo-full.svg"
        alt="Logo"
      />
      <div class="hero">
        <h1 class="hero__title">
          Your Journey to Coding Conf 2026 Starts Here!
        </h1>
        <p class="hero__text">
          Secure your spot at next year's biggest coding conference.
        </p>
      </div>
    </header>

    <main class="main">
      <form
        action=""
        class="main__ticket-form"
        id="ticket-form"
        name="ticket-form"
        method="get"
      >
        <label class="ticket-form__label" for="avatar">Upload avatar</label>
        <label class="dropzone" id="dropzone" for="avatar-input">
          <div class="dropzone__avatar-wrapper" id="avatar-wrapper">
            <img
              src="/src/assets/images/icon-upload.svg"
              class="dropzone__icon"
              id="avatar-icon"
              alt="Upload icon"
            />
          </div>
          <input
            class="dropzone__input"
            type="file"
            name="avatar"
            id="avatar-input"
            accept="image/*"
          />
          <div class="dropzone__btns-wrapper" id="btnsWrapper">
            <button class="dropzone__btn" id="remove-btn">Remove image</button>
            <button class="dropzone__btn" id="change-btn">Change image</button>
          </div>
          <p class="dropzone__text" id="dropzone-text">
            Drag and drop or click to upload
          </p>
        </label>
        <p class="ticket-form__hint">
          Upload your photo (JPG or PNG, max size: 500KB).
        </p>

        <label class="ticket-form__label" for="fullname">Full Name</label>
        <input
          class="ticket-form__input"
          type="text"
          name="fullname"
          id="fullname"
        />

        <label class="ticket-form__label" for="email">Email Address</label>
        <input
          class="ticket-form__input"
          type="email"
          name="email"
          id="email"
          placeholder="example@email.com"
        />

        <label class="ticket-from__label" for="github">GitHub Username</label>
        <input
          class="ticket-form__input"
          type="text"
          name="github"
          id="github"
          placeholder="@yourusername"
        />

        <input
          class="ticket-form__submit"
          type="submit"
          value="Generate My Ticket"
        />
      </form>
    </main>

    <img
      id="pattern-circle-top"
      src="/src/assets/images/pattern-circle.svg"
      alt="Circle top pattern"
    />
    <img
      id="pattern-lines"
      src="/src/assets/images/pattern-lines.svg"
      alt="Lines pattern"
    />
    <img
      id="pattern-line-top"
      src="/src/assets/images/pattern-squiggly-line-top.svg"
      alt="Line top pattern"
    />
    <img
      id="pattern-circle-middle"
      src="/src/assets/images/pattern-circle.svg"
      alt="Circle middle pattern"
    />
    <img
      id="pattern-line-bottom"
      src="/src/assets/images/pattern-squiggly-line-bottom-mobile-tablet.svg"
      alt="Line bottom pattern"
    />

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
